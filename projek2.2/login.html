<!DOCTYPE html>
<html>
<head>
    <title>Halaman Log Masuk</title>
    <style>
        body {
            /* Masukkan nama fail gambar background anda di bawah */
            background-image: url('bakery.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
        }

        /* Kotak borang supaya teks mudah dibaca di atas background */
        .login-box {
            background-color: rgba(255, 255, 255, 0.9); /* Latar belakang putih lutsinar */
            width: 320px;
            padding: 25px;
            margin: 80px auto;
            border-radius: 8px;
            text-align: center;
        }

        /* Gaya untuk ruang input */
        input[type="text"], input[type="email"], select {
            width: 100%;
            padding: 8px;
            margin: 8px 0 15px 0;
            box-sizing: border-box;
        }

        /* Gaya butang */
        button {
            width: 100%;
            padding: 10px;
            background-color: #0073e6;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Log Masuk</h2>

        <form>
            <p style="text-align: left; margin-bottom: 2px;">Nama:</p>
            <input type="text" name="nama" placeholder="Masukkan nama" required>

            <p style="text-align: left; margin-bottom: 2px;">Email:</p>
            <input type="email" name="email" placeholder="Masukkan email" required>

            <p style="text-align: left; margin-bottom: 2px;">Nombor Telefon:</p>
            <input type="text" name="notel" placeholder="Masukkan no. telefon" required>

            <p style="text-align: left; margin-bottom: 2px;">Jenis Pengguna:</p>
            <select name="peranan">
                <option value="pengguna">Pengguna Biasa</option>
                <option value="admin">Admin</option>
            </select>

            <br><br>

            <a href="menu.html">
                <button type="button">Log Masuk</button>
            </a>

            <br><br>

             <a href="index.html">
                <button type="button">Log keluar</button>
            </a>
        </form>
    </div>

</body>
</html>

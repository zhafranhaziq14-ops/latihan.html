<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk Kafe Layan Diri</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
        <h1>Kiosk Kafe Layan Diri</h1>

       <div class="table"
        
            <h3>1. Semakan Umur (Keahlian)</h3>
            <label for="umurInput">Masukkan Umur:</label>
            <input type="number" id="umurInput" placeholder="Cth: 20">
            <button onclick="semakUmur()">Semak Kelayakan</button>
            <p id="statusUmur" class="output-box">Status akan dipaparkan...</p>
        
       
            <h3>2. Pesanan Makanan</h3>
            <p class="menu-list">1: Kopi Oyen (RM5) <br> 2: Kek Ikan (RM10) <br> 3: Susu Segar (RM4)</p>
            
            <label for="kodMenu">Kod Menu (1-3):</label>
            <input type="number" id="kodMenu" placeholder="1 - 3">
            
            <label for="kuantitiInput">Kuantiti:</label>
            <input type="number" id="kuantitiInput" placeholder="Jumlah kuantiti">
            
            <button onclick="kiraPesanan()">Kira Pesanan</button>
            <p id="resitPesanan" class="output-box">Resit pesanan akan dipapakan...</p>
       
            <h3>3. Cetak Kupon Cabutan Bertuah</h3>
            <label for="jumlahKupon">Jumlah Kupon:</label>
            <input type="number" id="jumlahKupon" placeholder="Berapa keping?">
            <button onclick="janaKupon()">Jana Kupon</button>
            <p id="paparanKupon" class="output-box">Kupon akan paparkan...</p>

</div>
       
    

    
    <script src="app.js"></script>
</body>
</html>
